<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Revenue OS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family: Inter, sans-serif;
  background: #0a0f1c;
  color: white;
}

/* TOP BAR */
.topbar {
  background: rgba(17, 24, 39, 0.9);
  backdrop-filter: blur(10px);
  padding: 18px 30px;
  font-size: 18px;
  font-weight: 600;
  border-bottom: 1px solid #1f2937;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 30px;
}

/* CARD */
.card {
  background: linear-gradient(145deg, #111827, #0f172a);
  border: 1px solid #1f2937;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #3b82f6;
}

.title {
  font-size: 13px;
  color: #93c5fd;
  letter-spacing: 1px;
}

.value {
  font-size: 28px;
  margin-top: 10px;
  font-weight: 700;
}

/* BUTTON */
button {
  margin: 30px;
  padding: 12px 18px;
  background: linear-gradient(90deg, #2563eb, #1d4ed8);
  border: none;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  opacity: 0.9;
}

a {
  color: #60a5fa;
  margin-left: 30px;
}

</style>

</head>

<body>

<div class="topbar">
🚀 AI REVENUE OS — Enterprise AI Platform
</div>

<div class="grid">

<div class="card">
<div class="title">REVENUE</div>
<div class="value" id="revenue">--</div>
</div>

<div class="card">
<div class="title">PROFIT</div>
<div class="value" id="profit">--</div>
</div>

<div class="card">
<div class="title">REQUESTS</div>
<div class="value" id="requests">--</div>
</div>

</div>

<button onclick="load()">REFRESH METRICS</button>

<a href="/orchestrator.html">Open AI Orchestrator →</a>

<script>

async function load(){

  const res = await fetch('/api/v1/analytics/overview');
  const data = await res.json();

  document.getElementById('revenue').innerText =
    "$ " + data.saas.financials.revenue.toFixed(2);

  document.getElementById('profit').innerText =
    "$ " + data.saas.financials.profit.toFixed(2);

  document.getElementById('requests').innerText =
    data.saas.usage.requests;
}

load();

</script>

</body>
</html>
